specVersion: "4.0"
metadata:
  name: ui5-pdfme
type: library
customConfiguration:
  ui5-tooling-modules: &modulesConfig
    additionalDependencies:
      - "@pdfme/ui"
      - "@pdfme/generator"
      - "@pdfme/schemas"
      - "@pdfme/common"
    keepDynamicImports:
      - clawpdf
      - clawpdf/browser
framework:
  name: OpenUI5
  version: "1.120.49"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.ui.layout
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: ui5-tooling-modules-middleware
      afterMiddleware: compression
      configuration:
        <<: *modulesConfig
builder:
  libraryPreload:
    excludes:
      - "ui5/pdfme/thirdparty/_dynamics/**"
  customTasks:
    - name: ui5-tooling-modules-task
      afterTask: replaceVersion
      configuration:
        <<: *modulesConfig
        prependPathMappings: true
