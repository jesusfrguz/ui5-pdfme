        - generic [ref=f1e107]:
          - code [ref=f1e108]: "{ id: \"invoice-es\", name: \"Factura España\", description: \"Factura de ventas aprobada\", tags: [\"ventas\", \"es\"], status: \"published\", // draft | published | archived version: \"3\", createdAt: \"2026-08-20T09:00:00Z\", updatedAt: \"2026-08-23T10:30:00Z\", template, mapping, metadata: { dataContractVersion: \"2\" }, dataSources // opcional y desactivado por defecto al guardar }"
          - button "Copiar" [ref=f1e109] [cursor=pointer]
        - paragraph [ref=f1e110]:
          - text: Los nombres camelCase y los campos OData habituales (
          - code [ref=f1e111]: ID
          - text: ","
          - code [ref=f1e112]: Name
          - text: ","
          - code [ref=f1e113]: TemplateJson
          - text: ", etc.) se normalizan. Las columnas JSON pueden llegar como objetos o como cadenas JSON."
          - code [ref=f1e114]: repositoryId
          - text: lo añade el store y no sustituye al
          - code [ref=f1e115]: id
          - text: del registro.
