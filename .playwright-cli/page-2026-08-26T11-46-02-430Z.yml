          - button "Copiar" [ref=f1e142] [cursor=pointer]
        - paragraph [ref=f1e143]:
          - text: Guarda el array completo de registros como JSON. La clave predeterminada es
          - code [ref=f1e144]: ui5-pdfme.templates
          - text: ; usa una clave propia por aplicación y entorno para evitar colisiones. También puedes proporcionar un objeto compatible mediante
          - code [ref=f1e145]: storage
          - text: en el repositorio o, en Web, en la configuración del estudio.
        - paragraph [ref=f1e146]: Los datos pertenecen al origen y perfil del navegador. Pueden borrarse, tienen cuota limitada, no se sincronizan con otros dispositivos y dos pestañas pueden sobrescribir sus cambios. No trates esta opción como un repositorio corporativo ni como una frontera de seguridad.
