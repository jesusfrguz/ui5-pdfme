      - generic [ref=f1e364]:
        - text: Producción
        - heading "Seguridad y datos almacenados" [level=2] [ref=f1e365]
        - paragraph [ref=f1e366]:
          - text: Al guardar desde el estudio,
          - code [ref=f1e367]: dataSources
          - text: se excluye por defecto. Solo se persiste con
          - code [ref=f1e368]: "persistDataSources: true"
          - text: . Al abrir un registro, las fuentes almacenadas solo se aplican con
          - code [ref=f1e369]: "applyStoredDataSources: true"
          - text: .
        - generic [ref=f1e370]:
          - code [ref=f1e371]: "const studio = new WebPdfTemplateStudio(\"#studio\", { template, templateRepositories, persistDataSources: false, applyStoredDataSources: false });"
          - button "Copiar" [ref=f1e372] [cursor=pointer]
        - list [ref=f1e373]:
          - listitem [ref=f1e374]:
            - text: No guardes tokens, cookies, contraseñas ni payloads privados en
            - code [ref=f1e375]: template
            - text: ","
            - code [ref=f1e376]: mapping
            - text: ","
            - code [ref=f1e377]: metadata
            - text: o
            - code [ref=f1e378]: dataSources
            - text: .
          - listitem [ref=f1e379]: Autoriza por separado listar, leer, crear, actualizar y publicar.
          - listitem [ref=f1e380]: Impón filtros de tenant/propietario y límites de tamaño en el backend.
          - listitem [ref=f1e381]: Valida esquemas pdfme y mapeos antes de publicar.
          - listitem [ref=f1e382]: Usa versión o ETag para detectar escrituras concurrentes y conserva versiones publicadas inmutables.
          - listitem [ref=f1e383]: Trata nombres, descripciones y etiquetas remotas como texto no confiable.
      - generic [ref=f1e384]:
        - text: Checklist
        - heading "Validar la integración" [level=2] [ref=f1e385]
        - list [ref=f1e386]:
          - listitem [ref=f1e387]: Lista, filtra, abre y guarda en cada repositorio configurado.
          - listitem [ref=f1e388]: Comprueba una creación sin ID y una actualización con ID y versión.
          - listitem [ref=f1e389]:
            - text: Verifica que un resumen de listado sin
            - code [ref=f1e390]: template
            - text: provoque una lectura de detalle al abrirlo.
          - listitem [ref=f1e391]: Prueba paginación relativa y absoluta, el límite configurado y, en Web, la cancelación.
          - listitem [ref=f1e392]: Guarda, recarga y genera un PDF válido con el mapeo recuperado.
          - listitem [ref=f1e393]: Confirma que fuentes de datos y credenciales no se persisten accidentalmente.
          - listitem [ref=f1e394]: Prueba autorización, aislamiento de tenant y conflicto de versión en el backend.
        - paragraph [ref=f1e395]:
