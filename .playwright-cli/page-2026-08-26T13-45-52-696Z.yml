        - button "Copiar" [ref=f2e207] [cursor=pointer]
      - paragraph [ref=f2e208]:
        - text: Guarda el array completo de registros como JSON. La clave predeterminada es
        - code [ref=f2e209]: ui5-pdfme.templates
