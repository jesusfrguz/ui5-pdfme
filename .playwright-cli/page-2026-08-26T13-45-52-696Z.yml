        - text: o desactívalo con
        - code [ref=f2e339]: "false"
        - text: . La lectura conserva ETags V2/V4 dinámicos en
        - code [ref=f2e340]: record.etag
        - text: . Para escribir en SAP por HTTP, proporciona un
        - code [ref=f2e341]: fetch
        - text: de la aplicación que gestione sesión y
        - code [ref=f2e342]: X-CSRF-Token
        - text: ", y activa"
        - code [ref=f2e343]: "requireEtag: true"
        - text: ; después de una respuesta sin cuerpo se relee la entidad para recuperar versión, auditoría y ETag nuevos.
        - code [ref=f2e344]: fields
        - text: cambia los nombres usados al filtrar y guardar; si el servicio devuelve nombres completamente distintos, usa REST,
        - code [ref=f2e345]: function
        - text: o un proveedor registrado.
      - heading "SAPUI5 / OpenUI5 / Fiori con modelo propagado" [level=3] [ref=f2e346]
      - generic [ref=f2e347]:
        - code [ref=f2e348]: "studio.setTemplateRepositories([{ id: \"cap-model\", name: \"CAP\", type: \"odata\", modelName: \"templates\", path: \"/Templates\", pageSize: 100, maxRecords: 10000, updateGroupId: \"templates\" }]);"
        - button "Copiar" [ref=f2e349] [cursor=pointer]
      - paragraph [ref=f2e350]:
        - text: Esta modalidad conserva destinos, sesión, CSRF y grupos batch en el modelo de la aplicación. OData V4 usa bindings de lista/contexto y lee páginas hasta agotarlas o alcanzar
        - code [ref=f2e351]: maxRecords
        - text: . OData V2 usa
        - code [ref=f2e352]: read
        - text: ","
        - code [ref=f2e353]: create
        - text: "y"
        - code [ref=f2e354]: update
        - text: . Aplica filtros de tenant y propietario en el servicio o en el modelo, no solo en el catálogo.
      - generic [ref=f2e355]:
        - strong [ref=f2e356]: "Selector de implementación SAP:"
        - text: consulta la
        - link "guía de RAP, CAP, CDS clásico y SAP Gateway/SEGW" [ref=f2e357] [cursor=pointer]:
          - /url: ../sap/index.html
        - text: ", con reglas de paquete/transporte, descargas e instalador opcional en modo simulación."
    - generic [ref=f2e358]:
      - text: Aplicación
      - heading "Repositorio function" [level=2] [ref=f2e359]
      - generic [ref=f2e360]:
        - code [ref=f2e361]: "const repository = { id: \"application\", name: \"Repositorio de la aplicación\", type: \"function\", list: (query, context) => templateApi.list(query), get: (id, context) => templateApi.get(id), save: (record, context) => templateApi.save(record) };"
        - button "Copiar" [ref=f2e362] [cursor=pointer]
      - paragraph [ref=f2e363]:
        - text: Las tres funciones pueden ser síncronas o devolver promesas.
        - code [ref=f2e364]: list
        - text: debe devolver un array de registros o resúmenes;
        - code [ref=f2e365]: get
        - text: devuelve el registro completo;
        - code [ref=f2e366]: save
        - text: devuelve la versión persistida. Los callbacks son responsables de los IDs duraderos, fechas, versiones, conflictos y transacciones. Rechaza la promesa para que el estudio emita su evento de error.
      - paragraph [ref=f2e367]: "Si necesitas reutilizar un tipo propio en varias configuraciones, registra un proveedor. En este contrato el repositorio se recibe como primer argumento:"
      - generic [ref=f2e368]:
        - code [ref=f2e369]: "studio.registerTemplateRepositoryProvider(\"acme\", { list: (source, query, context) => {}, get: (source, id, context) => {}, save: (source, record, context) => {} });"
        - button "Copiar" [ref=f2e370] [cursor=pointer]
