        - code [ref=f2e89]: "{ id: \"invoice-es\", name: \"Factura España\", description: \"Factura de ventas aprobada\", tags: [\"ventas\", \"es\"], status: \"published\", // draft | published | archived version: \"3\", createdAt: \"2026-08-20T09:00:00Z\", updatedAt: \"2026-08-23T10:30:00Z\", template, mapping, metadata: { dataContractVersion: \"2\" }, dataSources // opcional y desactivado por defecto al guardar }"
