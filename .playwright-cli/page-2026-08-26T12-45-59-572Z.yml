    - generic [ref=f4e163]:
      - text: Recommended on ABAP
      - heading "RAP with OData V4" [level=2] [ref=f4e164]
      - paragraph [ref=f4e165]:
        - text: The fastest supported path is the ADT
        - strong [ref=f4e166]: Generate ABAP Repository Objects → OData Web API Service
        - text: wizard. The optional installer uses XCO APIs to create only missing data elements, table, root/projection views, BDEFs, behavior pool, service definition, and service binding.
      - paragraph [ref=f4e167]: The program takes a transportable package and a modifiable Workbench request. It starts in dry-run mode, never overwrites or deletes objects, and publishes the local endpoint only when explicitly selected. It targets an SAP S/4HANA 2022+ baseline; XCO APIs vary by release/SP, so syntax-check and ATC-check it in the target system.
      - generic [ref=f4e168]:
        - strong [ref=f4e169]: "Before production:"
        - text: add DCL/authorization, contract validation, server-side version increment, ETag, read-only audit fields, and limits. Confirm that all four JSON fields are unbounded
        - code [ref=f4e170]: Edm.String
        - text: properties in
        - code [ref=f4e171]: $metadata
        - text: .
    - generic [ref=f4e172]:
      - text: BTP
      - heading "SAP CAP CDS with OData V4" [level=2] [ref=f4e173]
      - paragraph [ref=f4e174]:
        - text: The included CAP Node.js quickstart defines the schema, OData V4 projection,
        - code [ref=f4e175]: TemplateViewer
        - text: /
        - code [ref=f4e176]: TemplateEditor
        - text: roles, validation, version/ETag handling, and limits. It uses SQLite locally and documents HANA/XSUAA/MTA preparation for BTP.
      - generic [ref=f4e177]:
        - code [ref=f4e178]: cd examples/backend/cap npm ci npm run start
        - button "Copy" [ref=f4e179] [cursor=pointer]
      - paragraph [ref=f4e180]: "CAP does not use an ABAP package or Workbench request: artifacts move through Git, CI/CD, MTA/HDI, and the project's BTP configuration."
    - generic [ref=f4e181]:
      - text: Complete legacy route
      - heading "SAP Gateway / SEGW OData V2" [level=2] [ref=f4e182]
      - paragraph [ref=f4e183]:
        - text: This is the viable legacy option for complete CRUD and long JSON. Download the EDMX, create a SEGW project in the backend package/request, import the model, generate MPC/DPC, and implement persistence in
        - code [ref=f4e184]: DPC_EXT
        - text: . Unbounded
        - code [ref=f4e185]: Edm.String
        - text: properties must map to ABAP
        - code [ref=f4e186]: STRING
        - text: .
      - list [ref=f4e187]:
        - listitem [ref=f4e188]: Create/verify DDIC and the IWPR project.
        - listitem [ref=f4e189]: Import the EDMX and generate MPC/MPC_EXT, DPC/DPC_EXT, IWSV, and IWMO.
        - listitem [ref=f4e190]: Implement a lightweight list, full detail, create, and update.
        - listitem [ref=f4e191]:
          - text: Activate on the hub with an existing alias; test
          - code [ref=f4e192]: $metadata
          - text: ", CSRF, and ETag."
      - paragraph [ref=f4e193]: SAP does not publish a universal API that creates/imports/generates an end-to-end SEGW project across the 7.40/7.50 landscape. The GUI step remains explicit. For unattended installation, prepare a transport or Add-On certified for each target release.
