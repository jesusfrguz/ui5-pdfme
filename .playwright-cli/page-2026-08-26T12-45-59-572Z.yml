          - strong [ref=f4e225]: Apply
          - text: ", and"
          - strong [ref=f4e226]: Publish
          - text: .
        - listitem [ref=f4e227]: The default mode only lists existing/missing objects.
        - listitem [ref=f4e228]: For RAP it creates the complete skeleton and can publish the local V4 binding.
        - listitem [ref=f4e229]: For CDS it creates a read-only V2 index; for SEGW it creates/verifies DDIC and points to the EDMX.
