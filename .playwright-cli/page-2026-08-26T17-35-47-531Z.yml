      - heading "Qué resuelve" [level=2] [ref=f1e52]
      - paragraph [ref=f1e53]: Permite crear visualmente plantillas para cualquier documento PDF —como facturas, pedidos, etiquetas, certificados o formularios— y rellenarlas automáticamente con datos reales procedentes de distintas fuentes. La generación puede realizarse de forma eficiente y en tiempo real directamente en el navegador, o de manera diferida.
