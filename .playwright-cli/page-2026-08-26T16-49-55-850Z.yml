        - heading "Plantillas" [level=2] [ref=e240]
        - paragraph [ref=e241]: "Una plantilla es la definición reutilizable del documento: describe las páginas y la posición, tamaño y estilo de cada elemento. Los datos de una factura, pedido o etiqueta no se guardan dentro del diseño; llegan por separado y el mapeo decide qué valor ocupa cada campo."
        - heading "Anatomía de una plantilla" [level=3] [ref=e242]
        - table [ref=e243]:
          - rowgroup [ref=e244]:
            - row [ref=e245]:
