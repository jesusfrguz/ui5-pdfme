          - code [ref=e268]: name
          - text: de cada schema debe ser único y estable en todas las páginas. Es la clave que une el diseño con
          - code [ref=e269]: mapping.fields
          - text: ; no uses como identificador una etiqueta traducida que pueda cambiar.
        - 'heading "Ejemplo: factura con texto, tabla y pie repetido" [level=3] [ref=e270]'
