                - code [ref=e262]: mapping.fields
              - cell [ref=e263]:
                - text: Conecta el
                - code [ref=e264]: name
                - text: del schema con una ruta de datos, una plantilla de texto o un formatter registrado; por ejemplo,
                - code [ref=e265]: "customer: \"order.customer\""
                - text: .
        - generic [ref=e266]:
