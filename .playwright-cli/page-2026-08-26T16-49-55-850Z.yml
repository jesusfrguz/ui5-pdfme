              - cell "Define el tamaño, los márgenes y el fondo; por ejemplo, A4 de 210 × 297 mm con 12 mm de margen. Puede ser una página en blanco o un PDF importado." [ref=e252]
            - row [ref=e253]:
              - cell [ref=e254]:
                - code [ref=e255]: schemas
              - cell "Contiene un array por página y, dentro de cada uno, los campos que se dibujarán. La primera posición representa la página 1." [ref=e256]
            - row [ref=e257]:
              - cell "Schema" [ref=e258]
              - cell "Describe un campo —por ejemplo un texto, una tabla, una imagen o un código QR— mediante su identificador, tipo, posición, dimensiones, contenido inicial y estilo." [ref=e259]
            - row [ref=e260]:
