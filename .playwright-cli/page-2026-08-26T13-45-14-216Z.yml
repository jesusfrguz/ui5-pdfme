      - text: Neutral
      - heading "REST" [level=2] [ref=f1e210]
      - paragraph [ref=f1e211]: If OData metadata is not useful, use the OpenAPI contract with the Node example and PostgreSQL schema. This is the portable option for an existing backend and preserves native JSON. Authentication, authorization, tenant isolation, ETag/version, and limits still belong to the service.
