    - generic [ref=f1e163]:
      - text: Recommended on ABAP
      - heading "RAP with OData V4" [level=2] [ref=f1e164]
      - paragraph [ref=f1e165]:
        - text: The fastest supported path is the ADT
        - strong [ref=f1e166]: Generate ABAP Repository Objects → OData Web API Service
        - text: wizard. The optional installer uses XCO APIs to create only missing data elements, table, root/projection views, BDEFs, behavior pool, service definition, and service binding.
      - paragraph [ref=f1e167]: The program takes a transportable package and a modifiable Workbench request. It starts in dry-run mode, never overwrites or deletes objects, and publishes the local endpoint only when explicitly selected. It targets an SAP S/4HANA 2022+ baseline; XCO APIs vary by release/SP, so syntax-check and ATC-check it in the target system.
      - generic [ref=f1e168]:
        - strong [ref=f1e169]: "Before production:"
        - text: add DCL/authorization, contract validation, server-side version increment, ETag, read-only audit fields, and limits. Confirm that all four JSON fields are unbounded
        - code [ref=f1e170]: Edm.String
        - text: properties in
        - code [ref=f1e171]: $metadata
        - text: .
    - generic [ref=f1e172]:
      - text: BTP
      - heading "SAP CAP CDS with OData V4" [level=2] [ref=f1e173]
      - paragraph [ref=f1e174]:
        - text: The included CAP Node.js quickstart defines the schema, OData V4 projection,
        - code [ref=f1e175]: TemplateViewer
        - text: /
        - code [ref=f1e176]: TemplateEditor
        - text: roles, validation, version/ETag handling, and limits. It uses SQLite locally and documents HANA/XSUAA/MTA preparation for BTP.
      - generic [ref=f1e177]:
        - code [ref=f1e178]: cd examples/backend/cap npm ci npm run start
        - button "Copy" [ref=f1e179] [cursor=pointer]
      - paragraph [ref=f1e180]: "CAP does not use an ABAP package or Workbench request: artifacts move through Git, CI/CD, MTA/HDI, and the project's BTP configuration."
    - generic [ref=f1e181]:
      - text: Legacy implementation required
      - heading "SAP Gateway / SEGW OData V2" [level=2] [ref=f1e182]
      - paragraph [ref=f1e183]:
        - text: This legacy route can support list, detail, create, and update with long JSON, but the kit does not include a
        - code [ref=f1e184]: DPC_EXT
        - text: implementation. Download the EDMX, create a SEGW project in the backend package/request, import the model, generate MPC/DPC, and implement persistence in
        - code [ref=f1e185]: DPC_EXT
        - text: . In SEGW leave Max Length blank/0 for the four unbounded JSON fields; these and
        - code [ref=f1e186]: Tags
        - text: must map to ABAP
        - code [ref=f1e187]: STRING
        - text: . Delete is outside the repository contract.
      - list [ref=f1e188]:
        - listitem [ref=f1e189]: Create/verify DDIC and the IWPR project.
        - listitem [ref=f1e190]: Import the EDMX and generate MPC/MPC_EXT, DPC/DPC_EXT, IWSV, and IWMO.
        - listitem [ref=f1e191]: Implement a lightweight list, full detail, create, and update.
        - listitem [ref=f1e192]:
          - text: Activate on the hub with an existing alias; test
          - code [ref=f1e193]: $metadata
          - text: ", CSRF, and ETag."
      - paragraph [ref=f1e194]: SAP does not publish a universal API that creates/imports/generates an end-to-end SEGW project across the 7.40/7.50 landscape. The GUI step remains explicit. For unattended installation, prepare a transport or Add-On certified for each target release.
