      - heading "Function repository" [level=2] [ref=f3e363]
      - generic [ref=f3e364]:
        - code [ref=f3e365]: "const repository = { id: \"application\", name: \"Application repository\", type: \"function\", list: (query, context) => templateApi.list(query), get: (id, context) => templateApi.get(id), save: (record, context) => templateApi.save(record) };"
        - button "Copy" [ref=f3e366] [cursor=pointer]
      - paragraph [ref=f3e367]:
        - text: All three functions may be synchronous or return promises.
        - code [ref=f3e368]: list
        - text: must return an array of records or summaries;
        - code [ref=f3e369]: get
        - text: returns the complete record;
        - code [ref=f3e370]: save
        - text: returns the persisted version. The callbacks own durable IDs, timestamps, versions, conflicts, and transactions. Reject the promise so the studio emits its error event.
      - paragraph [ref=f3e371]: "Register a provider when a custom type needs to be reused across configurations. In this contract, the repository is the first argument:"
      - generic [ref=f3e372]:
        - code [ref=f3e373]: "studio.registerTemplateRepositoryProvider(\"acme\", { list: (source, query, context) => {}, get: (source, id, context) => {}, save: (source, record, context) => {} });"
