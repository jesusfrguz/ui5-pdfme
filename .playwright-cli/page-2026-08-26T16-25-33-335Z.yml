      - heading "Security and stored data" [level=2] [ref=f3e445]
      - paragraph [ref=f3e446]:
        - text: When the studio saves,
        - code [ref=f3e447]: dataSources
        - text: is excluded by default. It is persisted only with
        - code [ref=f3e448]: "persistDataSources: true"
        - text: . When opening a record, stored sources are applied only with
        - code [ref=f3e449]: "applyStoredDataSources: true"
        - text: .
      - generic [ref=f3e450]:
        - code [ref=f3e451]: "const studio = new WebPdfTemplateStudio(\"#studio\", { template, templateRepositories, persistDataSources: false, applyStoredDataSources: false });"
        - button "Copy" [ref=f3e452] [cursor=pointer]
      - list [ref=f3e453]:
        - listitem [ref=f3e454]:
          - text: Do not store tokens, cookies, passwords, or private payloads in
          - code [ref=f3e455]: template
          - text: ","
          - code [ref=f3e456]: mapping
          - text: ","
          - code [ref=f3e457]: metadata
          - text: ", or"
          - code [ref=f3e458]: dataSources
          - text: .
        - listitem [ref=f3e459]: Authorize list, read, create, update, and publish separately.
        - listitem [ref=f3e460]: Enforce tenant/owner filters and size limits in the backend.
        - listitem [ref=f3e461]: Validate pdfme schemas and mappings before publishing.
        - listitem [ref=f3e462]: Use a version or ETag to detect concurrent writes and keep published versions immutable.
        - listitem [ref=f3e463]: Treat remote names, descriptions, and tags as untrusted text.
