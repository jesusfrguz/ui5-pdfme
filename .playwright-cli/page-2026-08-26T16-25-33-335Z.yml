      - text: Common model
      - heading "How it works" [level=2] [ref=f3e23]
      - paragraph [ref=f3e24]: The studio and catalog use a common store. Each repository adapts its persistence system to the same template-record contract.
      - generic "Template catalog flow" [ref=f3e25]:
        - generic [ref=f3e26]: Catalog / studio
        - generic [ref=f3e27]: →
        - generic [ref=f3e28]: TemplateStore
        - generic [ref=f3e29]: →
        - generic [ref=f3e30]: memory · localStorage · REST · OData · function
      - paragraph [ref=f3e31]:
        - text: You can configure multiple repositories. The catalog combines their results, searches names, descriptions, and tags, filters by status and source, and preserves
        - code [ref=f3e32]: repositoryId
        - text: so it knows where to retrieve or update each record. Results are not deduplicated, and a failed source makes the combined list fail.
      - paragraph [ref=f3e33]:
        - strong [ref=f3e34]: Blank template
        - text: and
        - strong [ref=f3e35]: Load PDF
        - text: remain available without a repository. Listing, opening a saved record, and persisting changes require at least one.
