        - code [ref=f3e200]: version
        - text: . Changes disappear when the application reloads or another configuration is created.
      - paragraph [ref=f3e201]: This is the simplest option for a reproducible, pre-seeded catalog in tests and demos. If initial records must remain unchanged between instances, provide a fresh copy of the array.
    - generic [ref=f3e202]:
