        - text: is reached. OData V2 uses
        - code [ref=f3e356]: read
        - text: ","
        - code [ref=f3e357]: create
        - text: ", and"
        - code [ref=f3e358]: update
        - text: . Apply tenant and owner filters in the service or model, not only in the catalog.
