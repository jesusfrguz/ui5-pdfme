              - cell [ref=e253]:
                - code [ref=e254]: schemas
              - cell "Contiene un array por página y, dentro de cada uno, los campos que se dibujarán. La primera posición representa la página 1." [ref=e255]
            - row [ref=e256]:
              - cell "Schema" [ref=e257]
              - cell "Describe un campo —por ejemplo un texto, una tabla, una imagen o un código QR— mediante su identificador, tipo, posición, dimensiones, contenido inicial y estilo." [ref=e258]
