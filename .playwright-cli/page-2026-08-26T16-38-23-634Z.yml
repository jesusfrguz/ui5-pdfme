          - paragraph [ref=f1e292]: Convierte todas las páginas de un PDF local en el fondo del diseño y permite colocar campos encima. El archivo debe ser un PDF válido.
        - article [ref=f1e293]:
          - heading "Abrir del catálogo" [level=3] [ref=f1e294]
          - paragraph [ref=f1e295]: Recupera una plantilla guardada. La búsqueda incluye nombre, descripción y etiquetas; también puedes filtrar por estado y repositorio.
      - paragraph [ref=f1e296]: El panel de datos permite insertar campos y tablas a partir de muestras resueltas. Los campos añadidos desde la paleta empiezan como estáticos; los insertados desde el panel de datos quedan conectados automáticamente. Antes de guardar, genera una vista previa con valores vacíos, textos largos y tablas con pocas y muchas filas.
      - heading "Guardar, localizar y versionar" [level=3] [ref=f1e297]
      - generic [ref=f1e298]:
        - code [ref=f1e299]: "await studio.saveTemplateRecord({ name: \"Factura de venta · España\", description: \"Factura A4 en español con IVA y pie legal\", tags: [\"ventas\", \"factura\", \"es\"], status: \"draft\", version: \"3\", metadata: { dataContractVersion: \"2\", language: \"es\" } }); const published = await studio.listTemplates({ search: \"factura\", status: \"published\" }); await studio.loadTemplate(\"invoice-es-v3\", { repositoryId: \"backend\" });"
        - button "Copiar" [ref=f1e300] [cursor=pointer]
      - paragraph [ref=f1e301]: "La primera guardada solicita los metadatos; las siguientes actualizan el registro activo. En producción, guarda juntos la plantilla y su mapeo, y registra además versión del contrato de datos, idioma, autor, estado y fecha. Trata una versión publicada como inmutable: crea otra versión para modificarla y conserva la anterior para reimpresiones históricas."
      - generic [ref=f1e302]:
        - strong [ref=f1e303]: "Seguridad:"
        - text: no incluyas credenciales, cookies, tokens ni payloads privados en una plantilla. Las fuentes de datos almacenadas se excluyen de forma predeterminada y su aplicación requiere una configuración explícita.
      - paragraph [ref=f1e304]:
        - text: Consulta el flujo visual en la
        - link "guía de uso" [ref=f1e305] [cursor=pointer]:
          - /url: guide/
        - text: y la configuración de memoria,
        - code [ref=f1e306]: localStorage
        - text: ", REST, OData o funciones en la guía"
        - link "Catálogo y repositorios de plantillas" [ref=f1e307] [cursor=pointer]:
          - /url: repositories/
        - text: .
