            - cell "Define el tamaño, los márgenes y el fondo; por ejemplo, A4 de 210 × 297 mm con 12 mm de margen. Puede ser una página en blanco o un PDF importado." [ref=f1e226]
          - row [ref=f1e227]:
            - cell [ref=f1e228]:
              - code [ref=f1e229]: schemas
            - cell "Contiene un array por página y, dentro de cada uno, los campos que se dibujarán. La primera posición representa la página 1." [ref=f1e230]
          - row [ref=f1e231]:
            - cell "Schema" [ref=f1e232]
            - cell "Describe un campo —por ejemplo un texto, una tabla, una imagen o un código QR— mediante su identificador, tipo, posición, dimensiones, contenido inicial y estilo." [ref=f1e233]
          - row [ref=f1e234]:
