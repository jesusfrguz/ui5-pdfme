          - rowgroup [ref=f4e251]:
            - row [ref=f4e252]:
              - cell [ref=f4e253]:
                - code [ref=f4e254]: basePdf
              - cell "Define el tamaño, los márgenes y el fondo; por ejemplo, A4 de 210 × 297 mm con 12 mm de margen. Puede ser una página en blanco o un PDF importado." [ref=f4e255]
            - row [ref=f4e256]:
              - cell [ref=f4e257]:
                - code [ref=f4e258]: schemas
              - cell "Contiene un array por página y, dentro de cada uno, los campos que se dibujarán. La primera posición representa la página 1." [ref=f4e259]
            - row [ref=f4e260]:
              - cell "Schema" [ref=f4e261]
              - cell "Describe un campo —por ejemplo un texto, una tabla, una imagen o un código QR— mediante su identificador, tipo, posición, dimensiones, contenido inicial y estilo." [ref=f4e262]
            - row [ref=f4e263]:
              - cell [ref=f4e264]:
                - code [ref=f4e265]: mapping.fields
              - cell [ref=f4e266]:
                - text: Conecta el
                - code [ref=f4e267]: name
                - text: del schema con una ruta de datos, una plantilla de texto o un formatter registrado; por ejemplo,
                - code [ref=f4e268]: "customer: \"order.customer\""
                - text: .
        - generic [ref=f4e269]:
          - strong [ref=f4e270]: "Contrato principal:"
          - text: el
          - code [ref=f4e271]: name
          - text: de cada schema debe ser único y estable en todas las páginas. Es la clave que une el diseño con
