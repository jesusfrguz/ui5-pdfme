      - generic [ref=f4e242]:
        - text: Diseño
        - heading "Plantillas" [level=2] [ref=f4e243]
        - paragraph [ref=f4e244]: "Una plantilla es la definición reutilizable del documento: describe las páginas y la posición, tamaño y estilo de cada elemento. Los datos de una factura, pedido o etiqueta no se guardan dentro del diseño; llegan por separado y el mapeo decide qué valor ocupa cada campo."
        - heading "Anatomía de una plantilla" [level=3] [ref=f4e245]
        - table [ref=f4e246]:
          - rowgroup [ref=f4e247]:
            - row [ref=f4e248]:
