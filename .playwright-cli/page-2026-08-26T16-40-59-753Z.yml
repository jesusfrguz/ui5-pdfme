        - heading "Tres formas de empezar" [level=3] [ref=f4e314]
        - generic [ref=f4e315]:
          - article [ref=f4e316]:
            - heading "Plantilla en blanco" [level=3] [ref=f4e317]
            - paragraph [ref=f4e318]: Crea una página A4 vacía. Es la opción más sencilla cuando el documento nace en el diseñador.
          - article [ref=f4e319]:
            - heading "Cargar PDF" [level=3] [ref=f4e320]
            - paragraph [ref=f4e321]: Convierte todas las páginas de un PDF local en el fondo del diseño y permite colocar campos encima. El archivo debe ser un PDF válido.
          - article [ref=f4e322]:
            - heading "Abrir del catálogo" [level=3] [ref=f4e323]
            - paragraph [ref=f4e324]: Recupera una plantilla guardada. La búsqueda incluye nombre, descripción y etiquetas; también puedes filtrar por estado y repositorio.
        - paragraph [ref=f4e325]: El panel de datos permite insertar campos y tablas a partir de muestras resueltas. Los campos añadidos desde la paleta empiezan como estáticos; los insertados desde el panel de datos quedan conectados automáticamente. Antes de guardar, genera una vista previa con valores vacíos, textos largos y tablas con pocas y muchas filas.
        - heading "Guardar, localizar y versionar" [level=3] [ref=f4e326]
        - generic [ref=f4e327]:
          - code [ref=f4e328]: "await studio.saveTemplateRecord({ name: \"Factura de venta · España\", description: \"Factura A4 en español con IVA y pie legal\", tags: [\"ventas\", \"factura\", \"es\"], status: \"draft\", version: \"3\", metadata: { dataContractVersion: \"2\", language: \"es\" } }); const published = await studio.listTemplates({ search: \"factura\", status: \"published\" }); await studio.loadTemplate(\"invoice-es-v3\", { repositoryId: \"backend\" });"
          - button "Copiar" [ref=f4e329] [cursor=pointer]
        - paragraph [ref=f4e330]: "La primera guardada solicita los metadatos; las siguientes actualizan el registro activo. En producción, guarda juntos la plantilla y su mapeo, y registra además versión del contrato de datos, idioma, autor, estado y fecha. Trata una versión publicada como inmutable: crea otra versión para modificarla y conserva la anterior para reimpresiones históricas."
        - generic [ref=f4e331]:
          - strong [ref=f4e332]: "Seguridad:"
          - text: no incluyas credenciales, cookies, tokens ni payloads privados en una plantilla. Las fuentes de datos almacenadas se excluyen de forma predeterminada y su aplicación requiere una configuración explícita.
        - paragraph [ref=f4e333]:
          - text: Consulta el flujo visual en la
          - link "guía de uso" [ref=f4e334] [cursor=pointer]:
            - /url: guide/
          - text: y la configuración de memoria,
          - code [ref=f4e335]: localStorage
          - text: ", REST, OData o funciones en la guía"
          - link "Catálogo y repositorios de plantillas" [ref=f4e336] [cursor=pointer]:
            - /url: repositories/
          - text: .
