      - text: Diseño
      - heading "Plantillas" [level=2] [ref=e190]
      - paragraph [ref=e191]: "Una plantilla es la definición reutilizable del documento: describe las páginas y la posición, tamaño y estilo de cada elemento. Los datos de una factura, pedido o etiqueta no se guardan dentro del diseño; llegan por separado y el mapeo decide qué valor ocupa cada campo."
      - heading "Anatomía de una plantilla" [level=3] [ref=e192]
      - table [ref=e193]:
        - rowgroup [ref=e194]:
          - row [ref=e195]:
            - columnheader "Parte" [ref=e196]
            - columnheader "Responsabilidad y ejemplo" [ref=e197]
        - rowgroup [ref=e198]:
          - row [ref=e199]:
            - cell [ref=e200]:
              - code [ref=e201]: basePdf
            - cell "Define el tamaño, los márgenes y el fondo; por ejemplo, A4 de 210 × 297 mm con 12 mm de margen. Puede ser una página en blanco o un PDF importado." [ref=e202]
          - row [ref=e203]:
            - cell [ref=e204]:
              - code [ref=e205]: schemas
            - cell "Contiene un array por página y, dentro de cada uno, los campos que se dibujarán. La primera posición representa la página 1." [ref=e206]
          - row [ref=e207]:
            - cell "Schema" [ref=e208]
            - cell "Describe un campo —por ejemplo un texto, una tabla, una imagen o un código QR— mediante su identificador, tipo, posición, dimensiones, contenido inicial y estilo." [ref=e209]
          - row [ref=e210]:
            - cell [ref=e211]:
              - code [ref=e212]: mapping.fields
            - cell [ref=e213]:
              - text: Conecta el
              - code [ref=e214]: name
              - text: del schema con una ruta de datos, una plantilla de texto o un formatter registrado; por ejemplo,
              - code [ref=e215]: "customer: \"order.customer\""
              - text: .
      - generic [ref=e216]:
        - strong [ref=e217]: "Contrato principal:"
        - text: el
        - code [ref=e218]: name
        - text: de cada schema debe ser único y estable en todas las páginas. Es la clave que une el diseño con
        - code [ref=e219]: mapping.fields
        - text: ; no uses como identificador una etiqueta traducida que pueda cambiar.
      - 'heading "Ejemplo: factura con texto, tabla y pie repetido" [level=3] [ref=e220]'
      - generic [ref=e221]:
        - code [ref=e222]: "const template = { basePdf: { width: 210, height: 297, padding: [12, 12, 25, 12] }, schemas: [[ { name: \"title\", type: \"text\", position: { x: 20, y: 18 }, width: 90, height: 12, content: \"FACTURA\", readOnly: true, fontSize: 22 }, { name: \"customer\", type: \"text\", position: { x: 20, y: 42 }, width: 130, height: 10, content: \"Cliente\", showLabel: true, label: \"Cliente\" }, { name: \"items\", type: \"table\", position: { x: 20, y: 68 }, width: 170, height: 70, content: \"[]\", head: [\"Concepto\", \"Cantidad\", \"Precio\"] }, { name: \"total\", type: \"text\", position: { x: 120, y: 150 }, width: 70, height: 10, content: \"0,00 €\", showLabel: true, label: \"Total\", alignment: \"right\" }, { name: \"footer\", type: \"text\", position: { x: 20, y: 278 }, width: 170, height: 6, content: \"Página {currentPage} de {totalPages}\", readOnly: true, fixedPosition: true, repeatOnEveryPage: true, alignment: \"center\" } ]] }; const mapping = { fields: { customer: \"order.customer\", items: { path: \"order.items\", formatter: \"table\", options: { columns: [\"description\", \"quantity\", \"price\"] } }, total: { path: \"order.total\", formatter: \"number\", options: { locale: \"es-ES\", style: \"currency\", currency: \"EUR\" } } } };"
        - button "Copiar" [ref=e223] [cursor=pointer]
