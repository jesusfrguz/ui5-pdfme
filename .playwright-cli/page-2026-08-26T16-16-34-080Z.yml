      - heading "Tres formas de empezar" [level=3] [ref=e261]
      - generic [ref=e262]:
        - article [ref=e263]:
          - heading "Plantilla en blanco" [level=3] [ref=e264]
          - paragraph [ref=e265]: Crea una página A4 vacía. Es la opción más sencilla cuando el documento nace en el diseñador.
        - article [ref=e266]:
          - heading "Cargar PDF" [level=3] [ref=e267]
          - paragraph [ref=e268]: Convierte todas las páginas de un PDF local en el fondo del diseño y permite colocar campos encima. El archivo debe ser un PDF válido.
        - article [ref=e269]:
          - heading "Abrir del catálogo" [level=3] [ref=e270]
          - paragraph [ref=e271]: Recupera una plantilla guardada. La búsqueda incluye nombre, descripción y etiquetas; también puedes filtrar por estado y repositorio.
      - paragraph [ref=e272]: El panel de datos permite insertar campos y tablas a partir de muestras resueltas. Los campos añadidos desde la paleta empiezan como estáticos; los insertados desde el panel de datos quedan conectados automáticamente. Antes de guardar, genera una vista previa con valores vacíos, textos largos y tablas con pocas y muchas filas.
      - heading "Guardar, localizar y versionar" [level=3] [ref=e273]
      - generic [ref=e274]:
        - code [ref=e275]: "await studio.saveTemplateRecord({ name: \"Factura de venta · España\", description: \"Factura A4 en español con IVA y pie legal\", tags: [\"ventas\", \"factura\", \"es\"], status: \"draft\", version: \"3\", metadata: { dataContractVersion: \"2\", language: \"es\" } }); const published = await studio.listTemplates({ search: \"factura\", status: \"published\" }); await studio.loadTemplate(\"invoice-es-v3\", { repositoryId: \"backend\" });"
        - button "Copiar" [ref=e276] [cursor=pointer]
      - paragraph [ref=e277]: "La primera guardada solicita los metadatos; las siguientes actualizan el registro activo. En producción, guarda juntos la plantilla y su mapeo, y registra además versión del contrato de datos, idioma, autor, estado y fecha. Trata una versión publicada como inmutable: crea otra versión para modificarla y conserva la anterior para reimpresiones históricas."
      - generic [ref=e278]:
        - strong [ref=e279]: "Seguridad:"
        - text: no incluyas credenciales, cookies, tokens ni payloads privados en una plantilla. Las fuentes de datos almacenadas se excluyen de forma predeterminada y su aplicación requiere una configuración explícita.
      - paragraph [ref=e280]:
