      - generic [ref=f5e88]:
        - code [ref=f5e89]: "{ id: \"invoice-es\", name: \"Factura España\", description: \"Factura de ventas aprobada\", tags: [\"ventas\", \"es\"], status: \"published\", // draft | published | archived version: \"3\", createdAt: \"2026-08-20T09:00:00Z\", updatedAt: \"2026-08-23T10:30:00Z\", template, mapping, metadata: { dataContractVersion: \"2\" }, dataSources // opcional y desactivado por defecto al guardar }"
        - button "Copiar" [ref=f5e90] [cursor=pointer]
      - paragraph [ref=f5e91]:
        - text: Los nombres camelCase y los campos OData habituales (
        - code [ref=f5e92]: ID
        - text: ","
        - code [ref=f5e93]: Name
        - text: ","
        - code [ref=f5e94]: TemplateJson
        - text: ", etc.) se normalizan. Las columnas JSON pueden llegar como objetos o como cadenas JSON."
        - code [ref=f5e95]: repositoryId
        - text: lo añade el store y no sustituye al
        - code [ref=f5e96]: id
        - text: "del registro. Los tres estados son convenciones del catálogo: el backend sigue siendo responsable de validar y autorizar el ciclo de aprobación."
