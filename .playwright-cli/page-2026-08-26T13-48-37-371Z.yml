      - heading "Registro de plantilla" [level=2] [ref=f5e83]
      - paragraph [ref=f5e84]:
        - text: Todos los proveedores reciben y devuelven la misma forma normalizada. Una respuesta de listado puede omitir
        - code [ref=f5e85]: template
        - text: ","
        - code [ref=f5e86]: mapping
