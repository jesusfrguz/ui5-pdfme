      - paragraph [ref=f5e199]:
        - text: El proveedor mantiene
        - code [ref=f5e200]: records
        - text: en el objeto de configuración. Al crear asigna un ID y fechas; al actualizar incrementa
        - code [ref=f5e201]: version
        - text: . Los cambios desaparecen cuando la aplicación se recarga o se crea otra configuración.
      - paragraph [ref=f5e202]: Es la opción más simple para precargar un catálogo reproducible en pruebas y demos. Si los registros iniciales deben conservarse intactos entre instancias, entrega una copia nueva del array.
    - generic [ref=f5e203]:
