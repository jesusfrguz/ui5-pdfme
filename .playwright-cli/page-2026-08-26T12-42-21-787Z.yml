        - list [ref=e241]:
          - listitem [ref=e242]:
            - text: Pide ruta RAP/CDS/SEGW, paquete, orden Workbench,
            - strong [ref=e243]: Apply
            - text: "y"
            - strong [ref=e244]: Publish
            - text: .
          - listitem [ref=e245]: El modo por defecto solo lista objetos existentes/faltantes.
          - listitem [ref=e246]: En RAP crea el esqueleto completo y puede publicar el binding V4 local.
          - listitem [ref=e247]: En CDS crea un índice V2 de lectura; en SEGW crea/verifica DDIC y remite al EDMX.
          - listitem [ref=e248]: No sobrescribe, borra, libera órdenes, crea alias/RFC/trust ni carga datos de catálogo.
        - paragraph [ref=e249]: "Un objeto existente se conserva aunque sea incompatible: compara sus campos/tipos con esta guía antes de aplicar. Los datos de plantilla son datos de aplicación y no deben transportarse en la orden Workbench."
