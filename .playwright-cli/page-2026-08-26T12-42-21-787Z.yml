      - generic [ref=e181]:
        - text: Recomendado en ABAP
        - heading "RAP con OData V4" [level=2] [ref=e182]
        - paragraph [ref=e183]:
          - text: La ruta más rápida soportada es el asistente de ADT
          - strong [ref=e184]: Generate ABAP Repository Objects → OData Web API Service
          - text: ". El instalador opcional usa las APIs XCO para crear solo lo que falta: elementos de datos, tabla, vistas raíz/proyección, BDEF, behavior pool, definición y binding de servicio."
        - paragraph [ref=e185]: El programa toma un paquete transportable y una orden Workbench modificable. Empieza siempre en modo simulación, no sobrescribe ni borra objetos y solo publica el endpoint local cuando se marca expresamente. Está orientado a S/4HANA 2022+; las APIs XCO varían por release/SP, por lo que se debe ejecutar syntax check y ATC en el sistema destino.
        - generic [ref=e186]:
          - strong [ref=e187]: "Antes de producción:"
          - text: añade DCL/autorizaciones, validaciones del contrato, incremento de versión en servidor, ETag, auditoría read-only y límites. Comprueba que los cuatro JSON aparecen como
          - code [ref=e188]: Edm.String
          - text: no acotados en
          - code [ref=e189]: $metadata
          - text: .
      - generic [ref=e190]:
        - text: BTP
        - heading "SAP CAP CDS con OData V4" [level=2] [ref=e191]
        - paragraph [ref=e192]:
          - text: El quickstart CAP Node.js incluido define el esquema, la proyección OData V4, roles
          - code [ref=e193]: TemplateViewer
          - text: /
          - code [ref=e194]: TemplateEditor
          - text: ", validación, versión/ETag y límites. Usa SQLite en local y documenta la preparación HANA/XSUAA/MTA para BTP."
        - generic [ref=e195]:
          - code [ref=e196]: cd examples/backend/cap npm ci npm run start
          - button "Copiar" [ref=e197] [cursor=pointer]
        - paragraph [ref=e198]: "CAP no usa paquete ABAP ni orden Workbench: sus artefactos viajan por Git, CI/CD, MTA/HDI y la configuración BTP del proyecto."
      - generic [ref=e199]:
        - text: Legacy completo
        - heading "SAP Gateway / SEGW OData V2" [level=2] [ref=e200]
        - paragraph [ref=e201]:
          - text: Es la opción heredada viable para CRUD completo y JSON largo. Descarga el EDMX, crea un proyecto SEGW en el paquete/orden del backend, importa el modelo, genera MPC/DPC y escribe la persistencia en
          - code [ref=e202]: DPC_EXT
          - text: . Los
          - code [ref=e203]: Edm.String
          - text: no acotados deben mapearse a ABAP
          - code [ref=e204]: STRING
          - text: .
        - list [ref=e205]:
          - listitem [ref=e206]: Crear/verificar DDIC y proyecto IWPR.
          - listitem [ref=e207]: Importar EDMX y generar MPC/MPC_EXT, DPC/DPC_EXT, IWSV e IWMO.
          - listitem [ref=e208]: Implementar listado ligero, detalle completo, creación y actualización.
          - listitem [ref=e209]:
            - text: Activar en el hub con alias existente, probar
            - code [ref=e210]: $metadata
            - text: ", CSRF y ETag."
        - paragraph [ref=e211]: SAP no publica una API universal para crear/importar/generar un proyecto SEGW de extremo a extremo en todos los releases 7.40/7.50. El paso gráfico queda explícito. Para una instalación sin intervención, prepara un transporte o Add-On certificado por release.
      - generic [ref=e212]:
        - text: Legacy limitado
        - heading "CDS clásico con autoexposición V2" [level=2] [ref=e213]
        - paragraph [ref=e214]:
          - code [ref=e215]: "@OData.publish: true"
          - text: genera el servicio
          - code [ref=e216]: ZPDFME_CDS_TPL_CDS
          - text: y sus artefactos backend al activar el DDLS; después hay que registrarlo en
          - code [ref=e217]: /IWFND/MAINT_SERVICE
          - text: o usar el activador opcional del hub.
        - paragraph [ref=e218]:
          - text: Esta ruta solo expone cabeceras del catálogo. Las vistas CDS DDIC clásicas no admiten de forma portable
          - code [ref=e219]: STRING
          - text: /
          - code [ref=e220]: RAWSTRING
          - text: /
          - code [ref=e221]: LCHR
          - text: /
          - code [ref=e222]: LRAW
          - text: ", y"
          - code [ref=e223]: SSTRING
          - text: no puede contener una plantilla completa. Por eso no implementa
          - code [ref=e224]: get
          - text: /
          - code [ref=e225]: save
          - text: del contrato completo.
      - generic [ref=e226]:
        - text: Neutral
        - heading "REST" [level=2] [ref=e227]
        - paragraph [ref=e228]: Si no necesitas metadatos OData, usa el contrato OpenAPI con el ejemplo Node y el esquema PostgreSQL. Es la opción portable para un backend existente y conserva JSON nativo. La autenticación, autorización, aislamiento de tenant, ETag/versión y límites siguen perteneciendo al servicio.
