      - generic [ref=e364]:
        - text: Producción
        - heading "Seguridad y datos almacenados" [level=2] [ref=e365]
        - paragraph [ref=e366]:
          - text: Al guardar desde el estudio,
          - code [ref=e367]: dataSources
          - text: se excluye por defecto. Solo se persiste con
          - code [ref=e368]: "persistDataSources: true"
          - text: . Al abrir un registro, las fuentes almacenadas solo se aplican con
          - code [ref=e369]: "applyStoredDataSources: true"
          - text: .
        - generic [ref=e370]:
          - code [ref=e371]: "const studio = new WebPdfTemplateStudio(\"#studio\", { template, templateRepositories, persistDataSources: false, applyStoredDataSources: false });"
          - button "Copiar" [ref=e372] [cursor=pointer]
        - list [ref=e373]:
          - listitem [ref=e374]:
            - text: No guardes tokens, cookies, contraseñas ni payloads privados en
            - code [ref=e375]: template
            - text: ","
            - code [ref=e376]: mapping
            - text: ","
            - code [ref=e377]: metadata
            - text: o
            - code [ref=e378]: dataSources
            - text: .
          - listitem [ref=e379]: Autoriza por separado listar, leer, crear, actualizar y publicar.
          - listitem [ref=e380]: Impón filtros de tenant/propietario y límites de tamaño en el backend.
          - listitem [ref=e381]: Valida esquemas pdfme y mapeos antes de publicar.
          - listitem [ref=e382]: Usa versión o ETag para detectar escrituras concurrentes y conserva versiones publicadas inmutables.
          - listitem [ref=e383]: Trata nombres, descripciones y etiquetas remotas como texto no confiable.
      - generic [ref=e384]:
        - text: Checklist
        - heading "Validar la integración" [level=2] [ref=e385]
        - list [ref=e386]:
          - listitem [ref=e387]: Lista, filtra, abre y guarda en cada repositorio configurado.
          - listitem [ref=e388]: Comprueba una creación sin ID y una actualización con ID y versión.
          - listitem [ref=e389]:
            - text: Verifica que un resumen de listado sin
            - code [ref=e390]: template
            - text: provoque una lectura de detalle al abrirlo.
          - listitem [ref=e391]: Prueba paginación relativa y absoluta, el límite configurado y, en Web, la cancelación.
          - listitem [ref=e392]: Guarda, recarga y genera un PDF válido con el mapeo recuperado.
          - listitem [ref=e393]: Confirma que fuentes de datos y credenciales no se persisten accidentalmente.
          - listitem [ref=e394]: Prueba autorización, aislamiento de tenant y conflicto de versión en el backend.
        - paragraph [ref=e395]:
          - text: El repositorio incluye un
          - link "ejemplo REST en Node, un esquema PostgreSQL y un modelo CAP/OData" [ref=e396] [cursor=pointer]:
            - /url: https://github.com/jesusfrguz/ui5-pdfme/tree/main/examples/backend
          - text: .
