      - generic [ref=e72]:
        - text: REST
        - heading "Contrato de jobs" [level=2] [ref=e73]
        - generic [ref=e74]:
          - code [ref=e75]: "POST /api/pdf-jobs Idempotency-Key: sales-order-5001-v3 Content-Type: application/json { \"templateId\": \"sales-order\", \"filename\": \"order-5001.pdf\", \"runAt\": \"2026-08-27T02:00:00Z\", \"payload\": { \"data\": { \"order\": { \"number\": \"5001\" } } } }"
          - button "Copiar" [ref=e76] [cursor=pointer]
        - paragraph [ref=e77]:
          - text: La respuesta es
          - code [ref=e78]: 202 Accepted
          - text: con
          - code [ref=e79]: id
          - text: ","
          - code [ref=e80]: statusUrl
          - text: "y"
          - code [ref=e81]: contentUrl
          - text: . Consulta el estado hasta
          - code [ref=e82]: DONE
          - text: o
          - code [ref=e83]: FAILED
          - text: . La descarga devuelve 409 mientras el PDF no esté listo.
        - generic [ref=e84]:
          - strong [ref=e85]: "Producción SAP:"
          - text: envía preferentemente
          - code [ref=e86]: businessObject
          - text: "y"
          - code [ref=e87]: businessKey
          - text: . El worker debe resolver los datos mediante una Destination autorizada; evita persistir documentos empresariales completos dentro de la cola.
      - generic [ref=e88]:
        - text: Servidor
        - heading "Instalación Node.js pura" [level=2] [ref=e89]
        - generic [ref=e90]:
          - code [ref=e91]: cd examples/deferred/node npm install npm start
          - button "Copiar" [ref=e92] [cursor=pointer]
        - paragraph [ref=e93]:
          - text: Sin
          - code [ref=e94]: DATABASE_URL
          - text: usa memoria. Con PostgreSQL crea las tablas de referencia y emplea
          - code [ref=e95]: FOR UPDATE SKIP LOCKED
          - text: ", por lo que pueden ejecutarse varios workers sin procesar el mismo job."
        - generic [ref=e96]:
          - code [ref=e97]: DATABASE_URL=postgresql://pdfme:secret@localhost:5432/pdfme PDF_OUTPUT_DIR=/srv/pdfme/output API_TOKEN=replace-me WORKER_ENABLED=true npm start
          - button "Copiar" [ref=e98] [cursor=pointer]
        - paragraph [ref=e99]:
          - text: Las variables adicionales controlan host, puerto, CORS, tamaño máximo, intervalo de polling y número de intentos. Se puede separar API y worker iniciando una instancia con
          - code [ref=e100]: WORKER_ENABLED=false
          - text: .
      - generic [ref=e101]:
        - text: Despliegue portable
        - heading "Docker y Docker Compose" [level=2] [ref=e102]
        - paragraph [ref=e103]: Docker empaqueta la API y el worker de generación diferida. Es una opción de despliegue de este patrón; el editor no lo necesita y el mismo worker también puede ejecutarse directamente con Node o CAP.
        - paragraph [ref=e104]:
          - text: La imagen de ejemplo se ejecuta sin privilegios de root, publica el puerto
          - code [ref=e105]: "3001"
          - text: ", expone la comprobación"
          - code [ref=e106]: /health
          - text: y conserva los PDF generados en un volumen.
        - generic [ref=e107]:
          - article [ref=e108]:
            - heading "Prueba local en memoria" [level=3] [ref=e109]
            - paragraph [ref=e110]: Inicia el servicio con la cola y las plantillas en memoria. Este modo pierde el estado al reiniciar y no debe escalarse.
            - generic [ref=e111]:
              - code [ref=e112]: cd examples/deferred/docker docker compose up --build
              - button "Copiar" [ref=e113] [cursor=pointer]
          - article [ref=e114]:
            - heading "PostgreSQL persistente" [level=3] [ref=e115]
            - paragraph [ref=e116]: Añade una base de datos y volúmenes duraderos para plantillas, trabajos y PDF. Es el modo adecuado para réplicas y despliegues reales.
            - generic [ref=e117]:
              - code [ref=e118]: docker compose -f compose.yaml -f compose.postgres.yaml up --build
              - button "Copiar" [ref=e119] [cursor=pointer]
