        - text: ECC / S/4HANA
        - heading "Consumir desde ABAP" [level=2] [ref=e157]
        - list [ref=e158]:
          - listitem [ref=e159]: Crea una Destination HTTP SM59 o Communication Arrangement.
          - listitem [ref=e160]: Haz POST del job con una clave de idempotencia estable.
          - listitem [ref=e161]: Guarda el ID junto al objeto de negocio.
          - listitem [ref=e162]: Un job de fondo ABAP consulta el estado; no mantengas un proceso de diálogo esperando.
          - listitem [ref=e163]:
            - text: Al finalizar, descarga el
            - code [ref=e164]: xstring
            - text: y archívalo mediante ArchiveLink, DMS/GOS o el repositorio aprobado.
        - generic [ref=e165]:
