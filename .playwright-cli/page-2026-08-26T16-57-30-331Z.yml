      - generic [ref=e168]:
        - text: Producción
        - heading "Seguridad y operación" [level=2] [ref=e169]
        - list [ref=e170]:
          - listitem [ref=e171]: Solo plantillas publicadas, versionadas y autorizadas.
          - listitem [ref=e172]: Nunca ejecutes URLs, loaders, formatters o plugins recibidos del job.
          - listitem [ref=e173]:
            - text: El renderer de referencia rechaza URLs remotas en
            - code [ref=e174]: basePdf
            - text: .
          - listitem [ref=e175]: Usa XSUAA/OAuth2 o mTLS; el token estático es solo una ayuda de despliegue aislado.
          - listitem [ref=e176]: Aísla tenant/propietario y limita payload, inputs, imágenes, tiempo, intentos y retención.
          - listitem [ref=e177]: Monitoriza antigüedad de cola, fallos, tiempo, tamaño, dead letters y capacidad.
