      - generic [ref=e146]:
        - text: Cliente UI5
        - heading "Consumir desde Fiori" [level=2] [ref=e147]
        - paragraph [ref=e148]: La vía REST recomendada publica el renderer tras un approuter y una Destination. Fiori envía el job, libera el busy indicator al recibir 202 y muestra el proceso en una lista de trabajos.
        - generic [ref=e149]:
          - code [ref=e150]: "const response = await fetch(\"/pdf-api/api/pdf-jobs\", { method: \"POST\", headers: { \"content-type\": \"application/json\", \"idempotency-key\": `order-${order.SalesOrder}` }, body: JSON.stringify({ templateId: \"sales-order\", filename: `order-${order.SalesOrder}.pdf`, payload: { data: { order } } }) }); const job = await response.json();"
          - button "Copiar" [ref=e151] [cursor=pointer]
        - paragraph [ref=e152]:
          - text: Para CAP, crea un modelo OData V4 y llama a
          - code [ref=e153]: /enqueue(...)
          - text: mediante
          - code [ref=e154]: bindContext
          - text: . Después lee
          - code [ref=e155]: /Jobs(<uuid>)
          - text: . El manual técnico incluye el código completo de envío, polling y descarga.
