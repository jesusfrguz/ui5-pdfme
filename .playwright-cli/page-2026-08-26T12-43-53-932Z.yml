        - listitem [ref=f3e224]:
          - text: Pide ruta RAP/CDS/SEGW, paquete, orden Workbench,
          - strong [ref=f3e225]: Apply
          - text: "y"
          - strong [ref=f3e226]: Publish
          - text: .
        - listitem [ref=f3e227]: El modo por defecto solo lista objetos existentes/faltantes.
        - listitem [ref=f3e228]: En RAP crea el esqueleto completo y puede publicar el binding V4 local.
        - listitem [ref=f3e229]: En CDS crea un índice V2 de lectura; en SEGW crea/verifica DDIC y remite al EDMX.
        - listitem [ref=f3e230]: No sobrescribe, borra, libera órdenes, crea alias/RFC/trust ni carga datos de catálogo.
      - paragraph [ref=f3e231]: "Un objeto existente se conserva aunque sea incompatible: compara sus campos/tipos con esta guía antes de aplicar. Los datos de plantilla son datos de aplicación y no deben transportarse en la orden Workbench."
