        - code [ref=f3e197]: "@OData.publish: true"
        - text: genera el servicio
        - code [ref=f3e198]: ZPDFME_CDS_TPL_CDS
        - text: y sus artefactos backend al activar el DDLS; después hay que registrarlo en
        - code [ref=f3e199]: /IWFND/MAINT_SERVICE
        - text: o usar el activador opcional del hub.
      - paragraph [ref=f3e200]:
        - text: Esta ruta solo expone cabeceras del catálogo. Las vistas CDS DDIC clásicas no admiten de forma portable
        - code [ref=f3e201]: STRING
        - text: /
        - code [ref=f3e202]: RAWSTRING
        - text: /
        - code [ref=f3e203]: LCHR
        - text: /
        - code [ref=f3e204]: LRAW
        - text: ", y"
        - code [ref=f3e205]: SSTRING
        - text: no puede contener una plantilla completa. Por eso no implementa
        - code [ref=f3e206]: get
        - text: /
        - code [ref=f3e207]: save
        - text: del contrato completo.
    - generic [ref=f3e208]:
      - text: Neutral
      - heading "REST" [level=2] [ref=f3e209]
      - paragraph [ref=f3e210]: Si no necesitas metadatos OData, usa el contrato OpenAPI con el ejemplo Node y el esquema PostgreSQL. Es la opción portable para un backend existente y conserva JSON nativo. La autenticación, autorización, aislamiento de tenant, ETag/versión y límites siguen perteneciendo al servicio.
