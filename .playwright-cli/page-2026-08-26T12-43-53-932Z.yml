    - generic [ref=f3e163]:
      - text: Recomendado en ABAP
      - heading "RAP con OData V4" [level=2] [ref=f3e164]
      - paragraph [ref=f3e165]:
        - text: La ruta más rápida soportada es el asistente de ADT
        - strong [ref=f3e166]: Generate ABAP Repository Objects → OData Web API Service
        - text: ". El instalador opcional usa las APIs XCO para crear solo lo que falta: elementos de datos, tabla, vistas raíz/proyección, BDEF, behavior pool, definición y binding de servicio."
      - paragraph [ref=f3e167]: El programa toma un paquete transportable y una orden Workbench modificable. Empieza siempre en modo simulación, no sobrescribe ni borra objetos y solo publica el endpoint local cuando se marca expresamente. Está orientado a S/4HANA 2022+; las APIs XCO varían por release/SP, por lo que se debe ejecutar syntax check y ATC en el sistema destino.
      - generic [ref=f3e168]:
        - strong [ref=f3e169]: "Antes de producción:"
        - text: añade DCL/autorizaciones, validaciones del contrato, incremento de versión en servidor, ETag, auditoría read-only y límites. Comprueba que los cuatro JSON aparecen como
        - code [ref=f3e170]: Edm.String
        - text: no acotados en
        - code [ref=f3e171]: $metadata
        - text: .
    - generic [ref=f3e172]:
      - text: BTP
      - heading "SAP CAP CDS con OData V4" [level=2] [ref=f3e173]
      - paragraph [ref=f3e174]:
        - text: El quickstart CAP Node.js incluido define el esquema, la proyección OData V4, roles
        - code [ref=f3e175]: TemplateViewer
        - text: /
        - code [ref=f3e176]: TemplateEditor
        - text: ", validación, versión/ETag y límites. Usa SQLite en local y documenta la preparación HANA/XSUAA/MTA para BTP."
      - generic [ref=f3e177]:
        - code [ref=f3e178]: cd examples/backend/cap npm ci npm run start
        - button "Copiar" [ref=f3e179] [cursor=pointer]
      - paragraph [ref=f3e180]: "CAP no usa paquete ABAP ni orden Workbench: sus artefactos viajan por Git, CI/CD, MTA/HDI y la configuración BTP del proyecto."
    - generic [ref=f3e181]:
      - text: Legacy completo
      - heading "SAP Gateway / SEGW OData V2" [level=2] [ref=f3e182]
      - paragraph [ref=f3e183]:
        - text: Es la opción heredada viable para CRUD completo y JSON largo. Descarga el EDMX, crea un proyecto SEGW en el paquete/orden del backend, importa el modelo, genera MPC/DPC y escribe la persistencia en
        - code [ref=f3e184]: DPC_EXT
        - text: . Los
        - code [ref=f3e185]: Edm.String
        - text: no acotados deben mapearse a ABAP
        - code [ref=f3e186]: STRING
        - text: .
      - list [ref=f3e187]:
        - listitem [ref=f3e188]: Crear/verificar DDIC y proyecto IWPR.
        - listitem [ref=f3e189]: Importar EDMX y generar MPC/MPC_EXT, DPC/DPC_EXT, IWSV e IWMO.
        - listitem [ref=f3e190]: Implementar listado ligero, detalle completo, creación y actualización.
        - listitem [ref=f3e191]:
          - text: Activar en el hub con alias existente, probar
          - code [ref=f3e192]: $metadata
          - text: ", CSRF y ETag."
      - paragraph [ref=f3e193]: SAP no publica una API universal para crear/importar/generar un proyecto SEGW de extremo a extremo en todos los releases 7.40/7.50. El paso gráfico queda explícito. Para una instalación sin intervención, prepara un transporte o Add-On certificado por release.
    - generic [ref=f3e194]:
      - text: Legacy limitado
      - heading "CDS clásico con autoexposición V2" [level=2] [ref=f3e195]
