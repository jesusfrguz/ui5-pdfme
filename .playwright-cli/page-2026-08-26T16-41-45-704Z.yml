            - cell [ref=f5e224]:
              - code [ref=f5e225]: basePdf
            - cell "Define el tamaño, los márgenes y el fondo; por ejemplo, A4 de 210 × 297 mm con 12 mm de margen. Puede ser una página en blanco o un PDF importado." [ref=f5e226]
          - row [ref=f5e227]:
            - cell [ref=f5e228]:
              - code [ref=f5e229]: schemas
            - cell "Contiene un array por página y, dentro de cada uno, los campos que se dibujarán. La primera posición representa la página 1." [ref=f5e230]
          - row [ref=f5e231]:
            - cell "Schema" [ref=f5e232]
            - cell "Describe un campo —por ejemplo un texto, una tabla, una imagen o un código QR— mediante su identificador, tipo, posición, dimensiones, contenido inicial y estilo." [ref=f5e233]
          - row [ref=f5e234]:
