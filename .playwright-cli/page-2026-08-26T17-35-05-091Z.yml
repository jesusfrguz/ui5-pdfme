            - row [ref=e256]:
              - cell [ref=e257]:
                - code [ref=e258]: schemas
              - cell "Contiene un array por página y, dentro de cada uno, los campos que se dibujarán. La primera posición representa la página 1." [ref=e259]
            - row [ref=e260]:
              - cell "Schema" [ref=e261]
              - cell "Describe un campo —por ejemplo un texto, una tabla, una imagen o un código QR— mediante su identificador, tipo, posición, dimensiones, contenido inicial y estilo." [ref=e262]
