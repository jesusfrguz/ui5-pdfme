      - generic [ref=e51]:
        - text: Funcional
        - heading "Qué resuelve" [level=2] [ref=e52]
        - paragraph [ref=e53]: Permite crear visualmente plantillas para cualquier documento PDF —como facturas, pedidos, etiquetas, certificados o formularios— y rellenarlas automáticamente con datos reales procedentes de distintas fuentes. La generación puede realizarse de forma eficiente y en tiempo real directamente en el navegador, o de manera diferida.
        - generic [ref=e54]:
          - article [ref=e55]:
            - heading "Diseño visual" [level=3] [ref=e56]
            - paragraph [ref=e57]: Textos, tablas, listas, imágenes, firmas, SVG, formas, fechas, selectores y códigos de barras.
          - article [ref=e58]:
            - heading "Datos combinados" [level=3] [ref=e59]
            - paragraph [ref=e60]: JSON, REST, funciones, OData V2/V4 y modelos UI5 con dependencias y valores alternativos.
          - article [ref=e61]:
            - heading "Salida real" [level=3] [ref=e62]
            - paragraph [ref=e63]: Plantilla versionable, vista previa PDF, descarga, impresión y bytes reutilizables por la aplicación.
