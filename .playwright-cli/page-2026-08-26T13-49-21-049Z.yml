      - paragraph [ref=f6e198]:
        - text: The provider keeps
        - code [ref=f6e199]: records
        - text: on the configuration object. On create it assigns an ID and timestamps; on update it increments
        - code [ref=f6e200]: version
        - text: . Changes disappear when the application reloads or another configuration is created.
      - paragraph [ref=f6e201]: This is the simplest option for a reproducible, pre-seeded catalog in tests and demos. If initial records must remain unchanged between instances, provide a fresh copy of the array.
    - generic [ref=f6e202]:
