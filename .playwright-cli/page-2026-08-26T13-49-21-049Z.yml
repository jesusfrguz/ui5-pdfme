        - listitem [ref=f6e466]: Test relative and absolute paging, the configured limit, and, on Web, cancellation.
        - listitem [ref=f6e467]: Save, reload, and generate a valid PDF with the retrieved mapping.
        - listitem [ref=f6e468]: Confirm that data sources and credentials are not persisted accidentally.
