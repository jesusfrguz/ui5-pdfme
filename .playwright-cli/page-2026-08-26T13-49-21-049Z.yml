      - generic [ref=f6e87]:
        - code [ref=f6e88]: "{ id: \"invoice-en\", name: \"English invoice\", description: \"Approved sales invoice\", tags: [\"sales\", \"en\"], status: \"published\", // draft | published | archived version: \"3\", createdAt: \"2026-08-20T09:00:00Z\", updatedAt: \"2026-08-23T10:30:00Z\", template, mapping, metadata: { dataContractVersion: \"2\" }, dataSources // optional and excluded from saves by default }"
