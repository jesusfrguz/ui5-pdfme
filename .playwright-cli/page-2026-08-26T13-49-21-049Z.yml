      - text: Common model
      - heading "How it works" [level=2] [ref=f6e23]
      - paragraph [ref=f6e24]: The studio and catalog use a common store. Each repository adapts its persistence system to the same template-record contract.
      - generic "Template catalog flow" [ref=f6e25]:
        - generic [ref=f6e26]: Catalog / studio
        - generic [ref=f6e27]: →
        - generic [ref=f6e28]: TemplateStore
        - generic [ref=f6e29]: →
        - generic [ref=f6e30]: memory · localStorage · REST · OData · function
      - paragraph [ref=f6e31]:
        - text: You can configure multiple repositories. The catalog combines their results, searches names, descriptions, and tags, filters by status and source, and preserves
        - code [ref=f6e32]: repositoryId
        - text: so it knows where to retrieve or update each record. Results are not deduplicated, and a failed source makes the combined list fail.
      - paragraph [ref=f6e33]:
        - strong [ref=f6e34]: Blank template
        - text: and
        - strong [ref=f6e35]: Load PDF
        - text: remain available without a repository. Listing, opening a saved record, and persisting changes require at least one.
