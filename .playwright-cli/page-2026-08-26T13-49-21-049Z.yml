      - text: Production
      - heading "Security and stored data" [level=2] [ref=f6e440]
      - paragraph [ref=f6e441]:
        - text: When the studio saves,
        - code [ref=f6e442]: dataSources
        - text: is excluded by default. It is persisted only with
        - code [ref=f6e443]: "persistDataSources: true"
        - text: . When opening a record, stored sources are applied only with
        - code [ref=f6e444]: "applyStoredDataSources: true"
        - text: .
      - generic [ref=f6e445]:
        - code [ref=f6e446]: "const studio = new WebPdfTemplateStudio(\"#studio\", { template, templateRepositories, persistDataSources: false, applyStoredDataSources: false });"
        - button "Copy" [ref=f6e447] [cursor=pointer]
      - list [ref=f6e448]:
        - listitem [ref=f6e449]:
          - text: Do not store tokens, cookies, passwords, or private payloads in
          - code [ref=f6e450]: template
          - text: ","
          - code [ref=f6e451]: mapping
          - text: ","
          - code [ref=f6e452]: metadata
          - text: ", or"
          - code [ref=f6e453]: dataSources
          - text: .
        - listitem [ref=f6e454]: Authorize list, read, create, update, and publish separately.
        - listitem [ref=f6e455]: Enforce tenant/owner filters and size limits in the backend.
        - listitem [ref=f6e456]: Validate pdfme schemas and mappings before publishing.
        - listitem [ref=f6e457]: Use a version or ETag to detect concurrent writes and keep published versions immutable.
        - listitem [ref=f6e458]: Treat remote names, descriptions, and tags as untrusted text.
