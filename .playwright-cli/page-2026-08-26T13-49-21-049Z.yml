        - button "Copy" [ref=f6e206] [cursor=pointer]
      - paragraph [ref=f6e207]:
        - text: It stores the complete record array as JSON. The default key is
        - code [ref=f6e208]: ui5-pdfme.templates
        - text: ; use an application- and environment-specific key to avoid collisions. You can also provide a compatible object through
        - code [ref=f6e209]: storage
        - text: on the repository or, on Web, on the studio configuration.
      - paragraph [ref=f6e210]: Data belongs to the browser's origin and profile. It can be cleared, has a limited quota, is not synchronized to other devices, and two tabs can overwrite each other's changes. Do not treat this option as a corporate repository or a security boundary.
