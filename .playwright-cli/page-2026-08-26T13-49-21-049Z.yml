        - code [ref=f6e360]: "const repository = { id: \"application\", name: \"Application repository\", type: \"function\", list: (query, context) => templateApi.list(query), get: (id, context) => templateApi.get(id), save: (record, context) => templateApi.save(record) };"
        - button "Copy" [ref=f6e361] [cursor=pointer]
      - paragraph [ref=f6e362]:
        - text: All three functions may be synchronous or return promises.
        - code [ref=f6e363]: list
        - text: must return an array of records or summaries;
        - code [ref=f6e364]: get
        - text: returns the complete record;
        - code [ref=f6e365]: save
        - text: returns the persisted version. The callbacks own durable IDs, timestamps, versions, conflicts, and transactions. Reject the promise so the studio emits its error event.
      - paragraph [ref=f6e366]: "Register a provider when a custom type needs to be reused across configurations. In this contract, the repository is the first argument:"
      - generic [ref=f6e367]:
        - code [ref=f6e368]: "studio.registerTemplateRepositoryProvider(\"acme\", { list: (source, query, context) => {}, get: (source, id, context) => {}, save: (source, record, context) => {} });"
        - button "Copy" [ref=f6e369] [cursor=pointer]
