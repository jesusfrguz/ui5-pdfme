        - listitem [ref=f2e596]: No guardes tokens, cookies o credenciales en una plantilla o fuente.
        - listitem [ref=f2e597]: Limita orígenes, rutas y tamaño de colecciones permitidos por el backend.
        - listitem [ref=f2e598]: La visibilidad de un campo no sustituye la autorización del servicio.
        - listitem [ref=f2e599]: Trata textos remotos como no confiables; las vistas previas usan APIs de texto.
        - listitem [ref=f2e600]: Valida y versiona template/mapping antes de publicar.
        - listitem [ref=f2e601]: La impresión silenciosa no está permitida por navegadores estándar; requiere infraestructura controlada.
