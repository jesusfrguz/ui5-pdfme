        - heading "Repositorio function" [level=2] [ref=f1e384]
        - generic [ref=f1e385]:
          - code [ref=f1e386]: "const repository = { id: \"application\", name: \"Repositorio de la aplicación\", type: \"function\", list: (query, context) => templateApi.list(query), get: (id, context) => templateApi.get(id), save: (record, context) => templateApi.save(record) };"
          - button "Copiar" [ref=f1e387] [cursor=pointer]
        - paragraph [ref=f1e388]:
          - text: Las tres funciones pueden ser síncronas o devolver promesas.
          - code [ref=f1e389]: list
          - text: debe devolver un array de registros o resúmenes;
          - code [ref=f1e390]: get
          - text: devuelve el registro completo;
          - code [ref=f1e391]: save
          - text: devuelve la versión persistida. Los callbacks son responsables de los IDs duraderos, fechas, versiones, conflictos y transacciones. Rechaza la promesa para que el estudio emita su evento de error.
        - paragraph [ref=f1e392]: "Si necesitas reutilizar un tipo propio en varias configuraciones, registra un proveedor. En este contrato el repositorio se recibe como primer argumento:"
        - generic [ref=f1e393]:
          - code [ref=f1e394]: "studio.registerTemplateRepositoryProvider(\"acme\", { list: (source, query, context) => {}, get: (source, id, context) => {}, save: (source, record, context) => {} });"
          - button "Copiar" [ref=f1e395] [cursor=pointer]
