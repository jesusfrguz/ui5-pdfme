      - generic [ref=f1e201]:
        - text: Todas las plataformas
        - heading "Configuración común" [level=2] [ref=f1e202]
        - generic [ref=f1e203]:
          - code [ref=f1e204]: "const templateRepositories = [ { id: \"session\", name: \"Ejemplos de esta sesión\", type: \"memory\", records: initialTemplates }, { id: \"browser\", name: \"Este navegador\", type: \"localStorage\", storageKey: \"my-app.pdf-templates\", default: true } ]; const studio = new WebPdfTemplateStudio(\"#studio\", { template, templateRepositories });"
          - button "Copiar" [ref=f1e205] [cursor=pointer]
        - paragraph [ref=f1e206]:
          - code [ref=f1e207]: id
          - text: identifica el origen en filtros y llamadas.
          - code [ref=f1e208]: name
          - text: es su etiqueta visible. Al guardar sin indicar un origen, se usa el primer repositorio con
          - code [ref=f1e209]: "default: true"
          - text: o, si no existe, el primero de la lista.
        - paragraph [ref=f1e210]:
          - text: React recibe el mismo array en la prop
          - code [ref=f1e211]: templateRepositories
          - text: . En UI5, pásalo a
          - code [ref=f1e212]: configure
          - text: o llama a
          - code [ref=f1e213]: setTemplateRepositories
          - text: .
      - generic [ref=f1e214]:
        - text: Volátil
        - heading "Repositorio memory" [level=2] [ref=f1e215]
        - generic [ref=f1e216]:
          - code [ref=f1e217]: "templateRepositories: [{ id: \"examples\", name: \"Plantillas de ejemplo\", type: \"memory\", records: [invoiceRecord, shippingLabelRecord] }]"
          - button "Copiar" [ref=f1e218] [cursor=pointer]
        - paragraph [ref=f1e219]:
          - text: El proveedor mantiene
          - code [ref=f1e220]: records
          - text: en el objeto de configuración. Al crear asigna un ID y fechas; al actualizar incrementa
          - code [ref=f1e221]: version
          - text: . Los cambios desaparecen cuando la aplicación se recarga o se crea otra configuración.
        - paragraph [ref=f1e222]: Es la opción más simple para precargar un catálogo reproducible en pruebas y demos. Si los registros iniciales deben conservarse intactos entre instancias, entrega una copia nueva del array.
      - generic [ref=f1e223]:
        - text: Navegador
        - heading "Repositorio localStorage" [level=2] [ref=f1e224]
        - generic [ref=f1e225]:
          - code [ref=f1e226]: "templateRepositories: [{ id: \"browser\", name: \"Este navegador\", type: \"localStorage\", storageKey: \"my-app.pdf-templates\", default: true }]"
          - button "Copiar" [ref=f1e227] [cursor=pointer]
        - paragraph [ref=f1e228]:
          - text: Guarda el array completo de registros como JSON. La clave predeterminada es
          - code [ref=f1e229]: ui5-pdfme.templates
          - text: ; usa una clave propia por aplicación y entorno para evitar colisiones. También puedes proporcionar un objeto compatible mediante
          - code [ref=f1e230]: storage
          - text: en el repositorio o, en Web, en la configuración del estudio.
        - paragraph [ref=f1e231]: Los datos pertenecen al origen y perfil del navegador. Pueden borrarse, tienen cuota limitada, no se sincronizan con otros dispositivos y dos pestañas pueden sobrescribir sus cambios. No trates esta opción como un repositorio corporativo ni como una frontera de seguridad.
