          - code [ref=f1e361]: Tags
          - text: y las columnas terminadas en
          - code [ref=f1e362]: Json
          - text: se serializan como cadenas JSON. Los listados seleccionan por defecto solo ID/nombre/descripción/etiquetas/estado/versión/auditoría para dejar los JSON grandes en la petición de detalle; personalízalo con
          - code [ref=f1e363]: listSelect
          - text: o desactívalo con
          - code [ref=f1e364]: "false"
          - text: . La lectura conserva ETags V2/V4 dinámicos en
          - code [ref=f1e365]: record.etag
          - text: . Para escribir en SAP por HTTP, proporciona un
          - code [ref=f1e366]: fetch
