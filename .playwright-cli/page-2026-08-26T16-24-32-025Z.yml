        - list [ref=f1e474]:
          - listitem [ref=f1e475]:
            - text: No guardes tokens, cookies, contraseñas ni payloads privados en
            - code [ref=f1e476]: template
            - text: ","
            - code [ref=f1e477]: mapping
            - text: ","
            - code [ref=f1e478]: metadata
            - text: o
            - code [ref=f1e479]: dataSources
            - text: .
