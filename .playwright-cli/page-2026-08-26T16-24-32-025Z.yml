        - heading "Seguridad y datos almacenados" [level=2] [ref=f1e466]
        - paragraph [ref=f1e467]:
          - text: Al guardar desde el estudio,
          - code [ref=f1e468]: dataSources
          - text: se excluye por defecto. Solo se persiste con
          - code [ref=f1e469]: "persistDataSources: true"
          - text: . Al abrir un registro, las fuentes almacenadas solo se aplican con
          - code [ref=f1e470]: "applyStoredDataSources: true"
          - text: .
        - generic [ref=f1e471]:
          - code [ref=f1e472]: "const studio = new WebPdfTemplateStudio(\"#studio\", { template, templateRepositories, persistDataSources: false, applyStoredDataSources: false });"
