          - listitem [ref=f1e481]: Impón filtros de tenant/propietario y límites de tamaño en el backend.
          - listitem [ref=f1e482]: Valida esquemas pdfme y mapeos antes de publicar.
          - listitem [ref=f1e483]: Usa versión o ETag para detectar escrituras concurrentes y conserva versiones publicadas inmutables.
          - listitem [ref=f1e484]: Trata nombres, descripciones y etiquetas remotas como texto no confiable.
