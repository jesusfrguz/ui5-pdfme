      - generic [ref=f1e102]:
        - text: Contrato estable
        - heading "Registro de plantilla" [level=2] [ref=f1e103]
        - paragraph [ref=f1e104]:
          - text: Todos los proveedores reciben y devuelven la misma forma normalizada. Una respuesta de listado puede omitir
          - code [ref=f1e105]: template
          - text: ","
          - code [ref=f1e106]: mapping
          - text: "y"
          - code [ref=f1e107]: dataSources
          - text: ; la respuesta de detalle debe incluir una plantilla pdfme válida.
        - generic [ref=f1e108]:
          - code [ref=f1e109]: "{ id: \"invoice-es\", name: \"Factura España\", description: \"Factura de ventas aprobada\", tags: [\"ventas\", \"es\"], status: \"published\", // draft | published | archived version: \"3\", createdAt: \"2026-08-20T09:00:00Z\", updatedAt: \"2026-08-23T10:30:00Z\", template, mapping, metadata: { dataContractVersion: \"2\" }, dataSources // opcional y desactivado por defecto al guardar }"
          - button "Copiar" [ref=f1e110] [cursor=pointer]
        - paragraph [ref=f1e111]:
          - text: Los nombres camelCase y los campos OData habituales (
          - code [ref=f1e112]: ID
          - text: ","
          - code [ref=f1e113]: Name
          - text: ","
          - code [ref=f1e114]: TemplateJson
          - text: ", etc.) se normalizan. Las columnas JSON pueden llegar como objetos o como cadenas JSON."
          - code [ref=f1e115]: repositoryId
          - text: lo añade el store y no sustituye al
          - code [ref=f1e116]: id
          - text: "del registro. Los tres estados son convenciones del catálogo: el backend sigue siendo responsable de validar y autorizar el ciclo de aprobación."
