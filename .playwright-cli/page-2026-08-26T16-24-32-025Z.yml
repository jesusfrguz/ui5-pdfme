      - generic [ref=f1e42]:
        - text: Modelo común
        - heading "Cómo funciona" [level=2] [ref=f1e43]
        - paragraph [ref=f1e44]:
          - text: El estudio y el catálogo trabajan con un
          - emphasis [ref=f1e45]: store
          - text: común. Cada repositorio adapta su sistema de persistencia al mismo registro de plantilla.
        - generic "Flujo del catálogo de plantillas" [ref=f1e46]:
          - generic [ref=f1e47]: Catálogo / estudio
          - generic [ref=f1e48]: →
          - generic [ref=f1e49]: TemplateStore
          - generic [ref=f1e50]: →
          - generic [ref=f1e51]: memory · localStorage · REST · OData · function
        - paragraph [ref=f1e52]:
          - text: Puedes configurar varios repositorios. El catálogo reúne sus resultados, permite buscar por nombre, descripción y etiquetas, filtra por estado y origen, y conserva
          - code [ref=f1e53]: repositoryId
          - text: para saber dónde recuperar o actualizar cada registro. No se eliminan duplicados y, si un origen falla, el listado combinado también falla.
        - paragraph [ref=f1e54]:
          - strong [ref=f1e55]: Plantilla en blanco
          - text: "y"
          - strong [ref=f1e56]: Cargar PDF
          - text: están disponibles aunque no haya repositorios. Listar, abrir un registro guardado y persistir cambios sí requieren al menos uno.
