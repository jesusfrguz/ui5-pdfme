    - generic [ref=f2e345]:
      - text: Producción
      - heading "Seguridad y datos almacenados" [level=2] [ref=f2e346]
      - paragraph [ref=f2e347]:
        - text: Al guardar desde el estudio,
        - code [ref=f2e348]: dataSources
        - text: se excluye por defecto. Solo se persiste con
        - code [ref=f2e349]: "persistDataSources: true"
        - text: . Al abrir un registro, las fuentes almacenadas solo se aplican con
        - code [ref=f2e350]: "applyStoredDataSources: true"
        - text: .
      - generic [ref=f2e351]:
        - code [ref=f2e352]: "const studio = new WebPdfTemplateStudio(\"#studio\", { template, templateRepositories, persistDataSources: false, applyStoredDataSources: false });"
        - button "Copiar" [ref=f2e353] [cursor=pointer]
      - list [ref=f2e354]:
        - listitem [ref=f2e355]:
          - text: No guardes tokens, cookies, contraseñas ni payloads privados en
          - code [ref=f2e356]: template
          - text: ","
          - code [ref=f2e357]: mapping
          - text: ","
          - code [ref=f2e358]: metadata
          - text: o
          - code [ref=f2e359]: dataSources
          - text: .
        - listitem [ref=f2e360]: Autoriza por separado listar, leer, crear, actualizar y publicar.
        - listitem [ref=f2e361]: Impón filtros de tenant/propietario y límites de tamaño en el backend.
        - listitem [ref=f2e362]: Valida esquemas pdfme y mapeos antes de publicar.
        - listitem [ref=f2e363]: Usa versión o ETag para detectar escrituras concurrentes y conserva versiones publicadas inmutables.
        - listitem [ref=f2e364]: Trata nombres, descripciones y etiquetas remotas como texto no confiable.
    - generic [ref=f2e365]:
      - text: Checklist
      - heading "Validar la integración" [level=2] [ref=f2e366]
      - list [ref=f2e367]:
        - listitem [ref=f2e368]: Lista, filtra, abre y guarda en cada repositorio configurado.
        - listitem [ref=f2e369]: Comprueba una creación sin ID y una actualización con ID y versión.
        - listitem [ref=f2e370]:
          - text: Verifica que un resumen de listado sin
          - code [ref=f2e371]: template
          - text: provoque una lectura de detalle al abrirlo.
        - listitem [ref=f2e372]: Prueba paginación relativa y absoluta, el límite configurado y, en Web, la cancelación.
        - listitem [ref=f2e373]: Guarda, recarga y genera un PDF válido con el mapeo recuperado.
        - listitem [ref=f2e374]: Confirma que fuentes de datos y credenciales no se persisten accidentalmente.
        - listitem [ref=f2e375]: Prueba autorización, aislamiento de tenant y conflicto de versión en el backend.
      - paragraph [ref=f2e376]:
        - text: El repositorio incluye un
        - link "ejemplo REST en Node, un esquema PostgreSQL y un modelo CAP/OData" [ref=f2e377] [cursor=pointer]:
          - /url: https://github.com/jesusfrguz/ui5-pdfme/tree/main/examples/backend
        - text: .
