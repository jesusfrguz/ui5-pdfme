    - generic [ref=f1e165]:
      - text: Diseño
      - heading "Plantillas" [level=2] [ref=f1e166]
      - paragraph [ref=f1e167]: "Una plantilla es la definición reutilizable del documento: describe las páginas y la posición, tamaño y estilo de cada elemento. Los datos de una factura, pedido o etiqueta no se guardan dentro del diseño; llegan por separado y el mapeo decide qué valor ocupa cada campo."
      - heading "Anatomía de una plantilla" [level=3] [ref=f1e168]
      - table [ref=f1e169]:
        - rowgroup [ref=f1e170]:
          - row [ref=f1e171]:
            - columnheader "Parte" [ref=f1e172]
            - columnheader "Responsabilidad y ejemplo" [ref=f1e173]
        - rowgroup [ref=f1e174]:
          - row [ref=f1e175]:
            - cell [ref=f1e176]:
              - code [ref=f1e177]: basePdf
            - cell "Define el tamaño, los márgenes y el fondo; por ejemplo, A4 de 210 × 297 mm con 12 mm de margen. Puede ser una página en blanco o un PDF importado." [ref=f1e178]
          - row [ref=f1e179]:
            - cell [ref=f1e180]:
              - code [ref=f1e181]: schemas
            - cell "Contiene un array por página y, dentro de cada uno, los campos que se dibujarán. La primera posición representa la página 1." [ref=f1e182]
          - row [ref=f1e183]:
            - cell "Schema" [ref=f1e184]
            - cell "Describe un campo —por ejemplo un texto, una tabla, una imagen o un código QR— mediante su identificador, tipo, posición, dimensiones, contenido inicial y estilo." [ref=f1e185]
          - row [ref=f1e186]:
            - cell [ref=f1e187]:
              - code [ref=f1e188]: mapping.fields
            - cell [ref=f1e189]:
              - text: Conecta el
              - code [ref=f1e190]: name
              - text: del schema con una ruta de datos, una plantilla de texto o un formatter registrado; por ejemplo,
              - code [ref=f1e191]: "customer: \"order.customer\""
              - text: .
      - generic [ref=f1e192]:
        - strong [ref=f1e193]: "Contrato principal:"
        - text: el
        - code [ref=f1e194]: name
        - text: de cada schema debe ser único y estable en todas las páginas. Es la clave que une el diseño con
        - code [ref=f1e195]: mapping.fields
        - text: ; no uses como identificador una etiqueta traducida que pueda cambiar.
      - 'heading "Ejemplo: factura con texto, tabla y pie repetido" [level=3] [ref=f1e196]'
      - generic [ref=f1e197]:
        - code [ref=f1e198]: "const template = { basePdf: { width: 210, height: 297, padding: [12, 12, 25, 12] }, schemas: [[ { name: \"title\", type: \"text\", position: { x: 20, y: 18 }, width: 90, height: 12, content: \"FACTURA\", readOnly: true, fontSize: 22 }, { name: \"customer\", type: \"text\", position: { x: 20, y: 42 }, width: 130, height: 10, content: \"Cliente\", showLabel: true, label: \"Cliente\" }, { name: \"items\", type: \"table\", position: { x: 20, y: 68 }, width: 170, height: 70, content: \"[]\", head: [\"Concepto\", \"Cantidad\", \"Precio\"] }, { name: \"total\", type: \"text\", position: { x: 120, y: 150 }, width: 70, height: 10, content: \"0,00 €\", showLabel: true, label: \"Total\", alignment: \"right\" }, { name: \"footer\", type: \"text\", position: { x: 20, y: 278 }, width: 170, height: 6, content: \"Página {currentPage} de {totalPages}\", readOnly: true, fixedPosition: true, repeatOnEveryPage: true, alignment: \"center\" } ]] }; const mapping = { fields: { customer: \"order.customer\", items: { path: \"order.items\", formatter: \"table\", options: { columns: [\"description\", \"quantity\", \"price\"] } }, total: { path: \"order.total\", formatter: \"number\", options: { locale: \"es-ES\", style: \"currency\", currency: \"EUR\" } } } };"
        - button "Copiar" [ref=f1e199] [cursor=pointer]
      - paragraph [ref=f1e200]:
        - text: Con datos como
