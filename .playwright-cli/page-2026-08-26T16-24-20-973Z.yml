          - code [ref=e270]: d.results
          - text: /
          - code [ref=e271]: d.__next
          - text: ). Se siguen enlaces relativos o absolutos hasta terminar, hasta
          - code [ref=e272]: maxPages
          - text: (100 por defecto), o hasta desactivar
          - code [ref=e273]: followNext
          - text: .
        - paragraph [ref=e274]:
          - text: En el adaptador Web puedes cambiar nombres de parámetros con
          - code [ref=e275]: searchParameter
          - text: ","
          - code [ref=e276]: statusParameter
          - text: ","
          - code [ref=e277]: tagsParameter
          - text: ","
          - code [ref=e278]: topParameter
          - text: "y"
          - code [ref=e279]: skipParameter
          - text: . Usa
          - code [ref=e280]: getUrl
          - text: ","
          - code [ref=e281]: createMethod
          - text: ","
          - code [ref=e282]: updateMethod
          - text: ","
          - code [ref=e283]: mapRecord
          - text: "y"
          - code [ref=e284]: serializeRecord
          - text: para adaptar una API existente. El proveedor REST nativo de UI5 usa los parámetros fijos
          - code [ref=e285]: search
          - text: ","
          - code [ref=e286]: status
          - text: ","
          - code [ref=e287]: top
          - text: "y"
          - code [ref=e288]: skip
          - text: ", y no aplica esas funciones de mapeo."
        - generic [ref=e289]:
          - code [ref=e290]: "const repository = { id: \"legacy-api\", type: \"rest\", url: \"/templates\", getUrl: (id) => `/templates/${encodeURIComponent(id)}`, mapRecord: (payload) => payload.result, serializeRecord: (record) => ({ documentTemplate: record }) };"
          - button "Copiar" [ref=e291] [cursor=pointer]
        - paragraph [ref=e292]:
          - text: El cliente usa credenciales
          - code [ref=e293]: same-origin
          - text: por defecto. Para autenticación dinámica, proporciona un
          - code [ref=e294]: fetch
          - text: de la aplicación; no incrustes bearer tokens en plantillas ni en ejemplos. Valida también el origen de cualquier enlace de página siguiente antes de reenviar cabeceras sensibles.
