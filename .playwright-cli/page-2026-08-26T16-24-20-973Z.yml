        - heading "SAPUI5 / OpenUI5 / Fiori con modelo propagado" [level=3] [ref=e371]
        - generic [ref=e372]:
          - code [ref=e373]: "studio.setTemplateRepositories([{ id: \"cap-model\", name: \"CAP\", type: \"odata\", modelName: \"templates\", path: \"/Templates\", pageSize: 100, maxRecords: 10000, updateGroupId: \"templates\" }]);"
          - button "Copiar" [ref=e374] [cursor=pointer]
        - paragraph [ref=e375]:
          - text: Esta modalidad conserva destinos, sesión, CSRF y grupos batch en el modelo de la aplicación. OData V4 usa bindings de lista/contexto y lee páginas hasta agotarlas o alcanzar
          - code [ref=e376]: maxRecords
          - text: . OData V2 usa
          - code [ref=e377]: read
          - text: ","
          - code [ref=e378]: create
          - text: "y"
          - code [ref=e379]: update
          - text: . Aplica filtros de tenant y propietario en el servicio o en el modelo, no solo en el catálogo.
