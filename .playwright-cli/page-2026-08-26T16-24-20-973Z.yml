          - text: . Las implementaciones de base de datos y OData deben validar el JSON decodificado, no solo la longitud de la columna serializada.
      - generic [ref=e201]:
        - text: Todas las plataformas
        - heading "Configuración común" [level=2] [ref=e202]
        - generic [ref=e203]:
          - code [ref=e204]: "const templateRepositories = [ { id: \"session\", name: \"Ejemplos de esta sesión\", type: \"memory\", records: initialTemplates }, { id: \"browser\", name: \"Este navegador\", type: \"localStorage\", storageKey: \"my-app.pdf-templates\", default: true } ]; const studio = new WebPdfTemplateStudio(\"#studio\", { template, templateRepositories });"
          - button "Copiar" [ref=e205] [cursor=pointer]
        - paragraph [ref=e206]:
          - code [ref=e207]: id
          - text: identifica el origen en filtros y llamadas.
          - code [ref=e208]: name
          - text: es su etiqueta visible. Al guardar sin indicar un origen, se usa el primer repositorio con
          - code [ref=e209]: "default: true"
          - text: o, si no existe, el primero de la lista.
        - paragraph [ref=e210]:
          - text: React recibe el mismo array en la prop
          - code [ref=e211]: templateRepositories
          - text: . En UI5, pásalo a
          - code [ref=e212]: configure
          - text: o llama a
          - code [ref=e213]: setTemplateRepositories
          - text: .
      - generic [ref=e214]:
        - text: Volátil
        - heading "Repositorio memory" [level=2] [ref=e215]
        - generic [ref=e216]:
          - code [ref=e217]: "templateRepositories: [{ id: \"examples\", name: \"Plantillas de ejemplo\", type: \"memory\", records: [invoiceRecord, shippingLabelRecord] }]"
          - button "Copiar" [ref=e218] [cursor=pointer]
        - paragraph [ref=e219]:
          - text: El proveedor mantiene
          - code [ref=e220]: records
          - text: en el objeto de configuración. Al crear asigna un ID y fechas; al actualizar incrementa
          - code [ref=e221]: version
          - text: . Los cambios desaparecen cuando la aplicación se recarga o se crea otra configuración.
        - paragraph [ref=e222]: Es la opción más simple para precargar un catálogo reproducible en pruebas y demos. Si los registros iniciales deben conservarse intactos entre instancias, entrega una copia nueva del array.
      - generic [ref=e223]:
        - text: Navegador
        - heading "Repositorio localStorage" [level=2] [ref=e224]
        - generic [ref=e225]:
          - code [ref=e226]: "templateRepositories: [{ id: \"browser\", name: \"Este navegador\", type: \"localStorage\", storageKey: \"my-app.pdf-templates\", default: true }]"
          - button "Copiar" [ref=e227] [cursor=pointer]
        - paragraph [ref=e228]:
          - text: Guarda el array completo de registros como JSON. La clave predeterminada es
          - code [ref=e229]: ui5-pdfme.templates
          - text: ; usa una clave propia por aplicación y entorno para evitar colisiones. También puedes proporcionar un objeto compatible mediante
          - code [ref=e230]: storage
          - text: en el repositorio o, en Web, en la configuración del estudio.
        - paragraph [ref=e231]: Los datos pertenecen al origen y perfil del navegador. Pueden borrarse, tienen cuota limitada, no se sincronizan con otros dispositivos y dos pestañas pueden sobrescribir sus cambios. No trates esta opción como un repositorio corporativo ni como una frontera de seguridad.
