name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx vite build examples/javascript --outDir ../../.tmp-web-build/javascript --emptyOutDir
      - run: npx vite build examples/react --outDir ../../.tmp-web-build/react --emptyOutDir
