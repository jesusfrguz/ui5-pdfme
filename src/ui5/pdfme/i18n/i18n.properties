helpTitle=Quick user guide
helpIntro=Create and check a template in five steps:
helpStep1=Open a template or start with the current design.
helpStep2=Add static elements from the palette, choose a QR/barcode type, or select a data field from the left panel.
helpStep3=Select an element to adjust its identifier and style; connected Text can show a label, stay fixed, and optionally repeat on every page.
helpStep4=Use PDF preview and check long, empty and repeated values, tables, margins, and page breaks.
helpStep5=Save the template with its repository metadata, then download or print the final PDF.
